<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TheBearLab Мастерская</title>
<meta name="theme-color" content="#191b3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BearLab">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}

/* Layout: app shell — top bar, icon rail + options panel on the left, 3D stage on the right (stacks on phones). Single committed dark-indigo look from the TBL deck. */
:root{
  color-scheme:dark;
  --stage-a:#33388a; --stage-b:#191b3f; --panel:#202246; --panel-2:#2a2d5c; --line:#3a3e78;
  --ink:#F4F4FF; --muted:#A9ACD6; --sun:#F6E21B; --go:#35E04B; --go-ink:#0D2A12; --violet:#A56BFF; --cyan:#2EE6F0; --risk:#FF5C5C;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage-b);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
button,input{font:inherit;color:inherit}
button,.tile,.chip,.move{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.stage,.rail,.top{-webkit-user-select:none;user-select:none}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:76px 340px 1fr;grid-template-rows:60px 1fr;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.logo{display:flex;align-items:center;white-space:nowrap;min-width:0}
.logo img{height:32px;width:auto;display:block}
.logo small{font-family:var(--f-body);font-weight:700;font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.ibtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--panel-2);display:grid;place-items:center;flex:none}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn svg{width:20px;height:20px}
.seg{display:flex;background:var(--panel-2);border-radius:12px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
.price{font-family:var(--f-display);font-weight:800;font-size:18px;background:var(--panel-2);padding:8px 14px;border-radius:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.price span{color:var(--sun)}
/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 8px;overflow-y:auto}
.rail button{border:0;background:none;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--muted)}
.rail button svg{width:26px;height:26px}
.rail button[aria-selected="true"]{background:var(--violet);color:#fff}
/* panel */
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px;display:flex;flex-direction:column;gap:20px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:18px;font-weight:800;margin:0;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel h2 .no{font-size:14px;background:var(--panel-2);color:var(--sun);border-radius:10px;padding:6px 9px;flex:none}
.price.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.panel .hint{color:var(--muted);font-size:13px;margin:-12px 0 0;line-height:1.45}
.grp{display:flex;flex-direction:column;gap:10px}
.grp>label,.grp>.lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{border:2px solid transparent;background:var(--panel-2);border-radius:14px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:12.5px;text-align:center;min-height:64px;justify-content:center;position:relative}
.tile[aria-pressed="true"]{border-color:var(--sun);background:#3a3d78}
.tile .p{font-size:11px;font-weight:800;color:var(--sun)}
.tile .sub{font-size:11px;color:var(--muted);font-weight:600}
.kid .tile{min-height:78px;font-size:14px}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.18);padding:0}
.sw button[aria-pressed="true"]{outline:3px solid var(--sun);outline-offset:2px}
.sw .none{background:conic-gradient(from 45deg,#555 0 25%,#888 0 50%,#555 0 75%,#888 0)}
.sw label.custom{width:30px;height:30px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden;cursor:pointer}
.sw label.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.kid .sw button,.kid .sw label.custom{width:38px;height:38px}
.rng{display:flex;flex-direction:column;gap:6px}
.rng .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
input[type=range]{width:100%;accent-color:var(--violet);height:24px}
.emo input[type=range]{accent-color:var(--go)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border-radius:12px;padding:10px 12px;font-weight:700;border:0;width:100%;text-align:left}
.tg .knob{width:40px;height:24px;border-radius:12px;background:#4a4e8c;position:relative;flex:none;transition:background .15s}
.tg .knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tg[aria-pressed="true"] .knob{background:var(--go)}
.tg[aria-pressed="true"] .knob::after{left:19px}
.tg .p{color:var(--sun);font-size:12px;margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--panel-2);border-radius:999px;padding:8px 12px;font-weight:700;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--go);color:var(--go-ink)}
.txt{width:100%;background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.preset{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--panel-2);border:2px solid transparent;border-radius:14px;padding:10px 12px;text-align:left}
.preset:hover{border-color:var(--line)}
.preset .dot{width:52px;height:52px;border-radius:50%;position:relative}
.preset .dot::before,.preset .dot::after{content:"";position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:inherit}
.preset .dot::before{left:2px}.preset .dot::after{right:2px}
.preset b{display:block;font-size:14px}
.preset span{font-size:12px;color:var(--muted)}
.preset .p{font-weight:800;color:var(--sun);font-size:12px}
/* stage */
.stage{position:relative;background:radial-gradient(120% 90% at 50% 35%,var(--stage-a),var(--stage-b));overflow:hidden;min-width:0}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;pointer-events:none;inset:0}
.ov>*{pointer-events:auto}
.tools{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.rbtn{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.rbtn svg{width:22px;height:22px}
.r-red{background:#F0563A}.r-green{background:#35C759}.r-blue{background:#4FB6F0}.r-violet{background:var(--violet)}
.done{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--go);color:var(--go-ink);border:0;border-radius:18px;padding:16px 26px;font-family:var(--f-display);font-weight:800;font-size:20px;box-shadow:0 0 28px rgba(53,224,75,.45),0 5px 0 #1f9a30}
.want{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;align-items:stretch}
.want form{display:flex;gap:8px;background:rgba(20,22,52,.82);backdrop-filter:blur(8px);border:2px solid var(--violet);border-radius:18px;padding:6px}
.want input{flex:1;min-width:0;background:none;border:0;padding:10px 12px;font-weight:600;font-size:15px}
.want input::placeholder{color:#9EA2D8}
.want input:focus{outline:none}
.want form:focus-within{box-shadow:0 0 0 3px rgba(165,107,255,.35)}
.want button{border:0;background:var(--violet);border-radius:13px;padding:0 16px;font-weight:800;color:#fff}
.want .ex{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.want .ex button{background:rgba(20,22,52,.7);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.bubble{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#fff;color:#1b1d44;font-weight:800;padding:10px 16px;border-radius:16px;max-width:min(440px,calc(100% - 32px));text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .25s,transform .25s;font-size:14px}
.bubble[data-off="1"]{opacity:0;transform:translate(-50%,-8px);pointer-events:none}
.badge{position:absolute;right:16px;top:16px;background:rgba(20,22,52,.7);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--muted);font-weight:700}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,9,24,.7);display:grid;place-items:center;z-index:30;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px;width:min(920px,100%);max-height:calc(100% - 16px);overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.sheet .shot{background:radial-gradient(120% 90% at 50% 35%,var(--stage-a),var(--stage-b));display:grid;place-items:center;min-height:300px;border-radius:22px 0 0 22px}
.sheet .shot img{max-width:100%;max-height:440px}
.sheet .body{padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.spec td:first-child{color:var(--muted);width:38%;padding-right:10px}
.spec td.n{text-align:right;color:var(--sun);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:800;font-size:20px}
.total span{color:var(--sun)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800}
.btn.go{background:var(--go);color:var(--go-ink)}
.btn.v{background:var(--violet);color:#fff}
.btn.g{background:var(--panel-2)}
.demo{font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:10px;padding:10px 12px;line-height:1.45}
.form{display:grid;gap:8px}
.ok{background:#173a22;border:1px solid #2c7a3e;border-radius:12px;padding:12px;font-weight:700}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--panel-2);padding:10px;border-radius:10px;user-select:all}
.sheet.small{grid-template-columns:1fr;width:min(520px,100%)}
.sheetwrap{display:contents}
.phone-only{display:none!important}
.r-gray{background:#5b5f9e}
.rbtn:disabled{opacity:.4}
.grab{display:none}
.moves{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.move{border:0;background:var(--panel-2);border-radius:16px;padding:14px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;text-align:left}
.move svg{width:28px;height:28px;flex:none;color:var(--sun)}
.move:active{transform:scale(.97)}
.move[aria-pressed="true"]{background:var(--violet);color:#fff}
.move[aria-pressed="true"] svg{color:#fff}
.upload{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:16px;padding:20px 14px;text-align:center;font-weight:800;cursor:pointer;background:var(--panel-2)}
.upload:hover,.upload.drag{border-color:var(--sun)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload span{font-size:12px;color:var(--muted);font-weight:600}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:13px;line-height:1.5}
.steps li+li{margin-top:4px}
.steps b{color:var(--ink)}
@media (max-width:980px){.app{grid-template-columns:68px 280px 1fr}}
@media (max-width:760px){
  html,body{overflow:hidden;overscroll-behavior:none}
  .app{display:block;height:100%;position:relative}
  .stage{position:fixed;inset:0}
  .top{position:fixed;left:0;right:0;top:0;z-index:10;height:auto;flex-wrap:nowrap;gap:6px;border:0;background:linear-gradient(rgba(25,27,63,.95),rgba(25,27,63,.75) 70%,rgba(25,27,63,0));padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px))}
  .logo small{display:none}
  .logo img{height:22px}
  .top #undo,.top #redo{display:none}
  .phone-only{display:grid!important}
  .ibtn{width:34px;height:34px;border-radius:10px}
  .seg button{padding:6px 8px;font-size:11.5px}
  .price{font-size:14px;padding:6px 10px;border-radius:10px}
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:14;flex-direction:row;overflow-x:auto;border:0;border-top:1px solid var(--line);gap:2px;scrollbar-width:none;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .rail::-webkit-scrollbar{display:none}
  .rail button{min-width:64px;flex:none;padding:6px 2px}
  .rail button svg{width:24px;height:24px}
  .sheetwrap{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:var(--railH,64px);z-index:13;height:min(50vh,440px);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -12px 34px rgba(0,0,0,.4);
    transform:translateY(calc(100% + var(--railH,64px)));transition:transform .3s cubic-bezier(.2,.8,.2,1),height .3s cubic-bezier(.2,.8,.2,1)}
  .app.sheet-open .sheetwrap{transform:none}
  .app.sheet-full .sheetwrap{height:calc(100% - var(--railH,64px) - 64px - env(safe-area-inset-top,0px))}
  .grab{display:flex;justify-content:center;align-items:center;border:0;background:none;height:26px;flex:none;touch-action:none;cursor:grab}
  .grab span{width:44px;height:5px;border-radius:3px;background:var(--line)}
  .panel{flex:1;border:0;overflow-y:auto;overscroll-behavior:contain;padding:4px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));gap:18px}
  .want{bottom:calc(var(--railH,64px) + 74px)}
  .want .ex{display:none}
  .tools{bottom:calc(var(--railH,64px) + 14px);left:max(14px,env(safe-area-inset-left,0px))}
  .done{bottom:calc(var(--railH,64px) + 14px);right:max(14px,env(safe-area-inset-right,0px));padding:12px 18px;font-size:16px}
  .app.sheet-open .want,.app.sheet-open .tools,.app.sheet-open .done{opacity:0;pointer-events:none}
  .want,.tools,.done{transition:opacity .2s}
  .rbtn{width:44px;height:44px}
  .bubble{top:calc(62px + env(safe-area-inset-top,0px))}
  .badge{display:none}
  .tile{min-height:58px}
  .modal{align-items:end;padding:0}
  .sheet{grid-template-columns:1fr;border-radius:24px 24px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet .shot{border-radius:24px 24px 0 0;min-height:200px}
  .sheet .shot img{max-height:240px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="logo"><img src="logo.png" alt="The BeAR Lab" width="600" height="96"><small>Мастерская мишек · прототип</small></div>
    <div class="spacer"></div>
    <button class="ibtn" id="undo" aria-label="Отменить" title="Отменить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ibtn" id="redo" aria-label="Повторить" title="Повторить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <div class="seg" role="group" aria-label="Режим">
      <button id="m-kid" aria-pressed="true">Детский</button>
      <button id="m-pro" aria-pressed="false">Мастер</button>
    </div>
    <div class="price" aria-live="polite"><span id="price">2 990</span> ₽</div>
  </header>
  <nav class="rail" id="rail" role="tablist" aria-label="Части мишки"></nav>
  <section class="sheetwrap" id="sheet"><button class="grab" id="grab" aria-label="Свернуть панель"><span></span></button><div class="panel" id="panel" aria-live="polite"></div></section>
  <main class="stage" id="stage">
    <div class="loading" id="loading">Загружаю мишку…</div>
    <div class="ov">
      <div class="bubble" id="bubble" data-off="1"></div>
      <div class="badge">Крути мишку пальцем · нажми на него</div>
      <div class="want">
        <form id="wantForm" autocomplete="off">
          <input id="wantInput" type="text" placeholder="Хочу… например, «чёрного мишку с красными лапами»" aria-label="Опиши мишку словами">
          <button type="submit">Собрать</button>
        </form>
        <div class="ex" id="examples"></div>
      </div>
      <div class="tools">
        <button class="rbtn r-gray phone-only" id="undo2" aria-label="Отменить" title="Отменить"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="rbtn r-red" id="reset" aria-label="Начать заново" title="Начать заново"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
        <button class="rbtn r-violet" id="random" aria-label="Удиви меня" title="Удиви меня"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.3" fill="#fff"/><circle cx="15" cy="15" r="1.3" fill="#fff"/><circle cx="15" cy="9" r="1.3" fill="#fff"/><circle cx="9" cy="15" r="1.3" fill="#fff"/></svg></button>
        <button class="rbtn r-blue" id="share" aria-label="Код мишки" title="Код мишки"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5h14v-5"/></svg></button>
      </div>
      <button class="done" id="done">ГОТОВО</button>
    </div>
  </main>
</div>
<div class="modal" id="modal" hidden></div>
<canvas id="confetti"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

/* ---- textures ---- */
function canvasTex(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;return {c,x:c.getContext('2d'),t}}
const TX={main:canvasTex(1024,512),accent:canvasTex(64,32),ear:canvasTex(64,32),limb:canvasTex(1024,512),pad:canvasTex(64,32),padName:canvasTex(512,256)};
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function heartPath(x,cx,cy,s){x.beginPath();x.moveTo(cx,cy+s*.35);x.bezierCurveTo(cx-s*1.1,cy-s*.4,cx-s*.45,cy-s*1.05,cx,cy-s*.45);x.bezierCurveTo(cx+s*.45,cy-s*1.05,cx+s*1.1,cy-s*.4,cx,cy+s*.35);x.fill()}
function starPath(x,cx,cy,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.fill()}
function paintPattern(T,base){
  const {x,c}=T,W=c.width,H=c.height,R=rnd(7);x.fillStyle=base;x.fillRect(0,0,W,H);
  const pc=cfg.patternColor;x.fillStyle=pc;x.strokeStyle=pc;
  switch(cfg.pattern){
    case 'spots':for(let i=0;i<46;i++){const r=14+R()*30;x.beginPath();x.ellipse(R()*W,40+R()*(H-80),r*1.3,r,R()*3,0,7);x.fill()}break;
    case 'stripes':x.lineWidth=18;x.lineCap='round';for(let i=0;i<22;i++){const u=i/22*W+R()*14;x.beginPath();x.moveTo(u,60+R()*60);for(let y=60;y<H-50;y+=20)x.lineTo(u+Math.sin(y*.04+i)*14,y);x.stroke()}break;
    case 'hearts':for(let j=0;j<6;j++)for(let i=0;i<14;i++)heartPath(x,(i+(j%2)*.5)/14*W,50+j*(H-90)/5,17);break;
    case 'stars':for(let j=0;j<6;j++)for(let i=0;i<14;i++)starPath(x,(i+(j%2)*.5)/14*W,50+j*(H-90)/5,13+R()*8);break;
    case 'patches':for(let i=0;i<16;i++){const w=60+R()*70,h=50+R()*60,u=R()*W,v=50+R()*(H-150);x.globalAlpha=.85;x.fillRect(u,v,w,h);x.globalAlpha=1;x.save();x.setLineDash([8,7]);x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.35)';x.strokeRect(u+6,v+6,w-12,h-12);x.restore()}break;
    case 'gradient':{const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,base);g.addColorStop(1,pc);x.fillStyle=g;x.fillRect(0,0,W,H)}break;
  }
  T.t.needsUpdate=true;
}
function paintSolid(T,col){T.x.fillStyle=col;T.x.fillRect(0,0,T.c.width,T.c.height);T.t.needsUpdate=true}
function paintPadName(){const T=TX.padName,{x,c}=T;x.fillStyle=cfg.pads;x.fillRect(0,0,c.width,c.height);const n=cfg.name.trim();
  if(n){x.save();const l=lum(cfg.pads);x.fillStyle=l>.55?'#3a2416':'#fff7e8';x.font=`800 ${n.length>6?24:30}px Manrope, Arial, sans-serif`;x.textAlign='center';x.textBaseline='middle';x.translate(c.width*.25,c.height*.5);x.fillText(n,0,0);x.restore()}
  T.t.needsUpdate=true}
function lum(h){const c=new THREE.Color(h);return .3*c.r+.59*c.g+.11*c.b}
function paintAll(){paintPattern(TX.main,cfg.main);paintSolid(TX.accent,cfg.accent);

/* ---- fur shader ---- */
const VS=`uniform float uLayer,uLen,uGrav,uTime,uWind;varying vec2 vUv;varying vec3 vN;varying vec3 vW;
void main(){vUv=uv;vec3 p=position+normal*uLen*uLayer;vec4 w=modelMatrix*vec4(p,1.0);
w.y-=uGrav*uLen*uLayer*uLayer*1.4;w.x+=sin(uTime*1.6+w.y*3.0)*uWind*uLen*uLayer*uLayer;
vN=normalize(mat3(modelMatrix)*normal);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;
const FS=`uniform sampler2D uMap;uniform vec3 uTip,uLight;uniform float uTipMix,uLayer,uDensity,uCurl,uBase,uAO;varying vec2 vUv;varying vec3 vN;varying vec3 vW;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){vec2 st=vUv*vec2(uDensity*2.0,uDensity);vec2 cell=floor(st);vec2 f=fract(st)-0.5;float h=hash(cell);
if(uBase<0.5){float a=uLayer*uCurl*9.0+h*6.283;f+=vec2(cos(a),sin(a))*0.24*uCurl*uLayer;float r=length(f);
if(h<uLayer*0.8||r>(1.0-uLayer)*0.55+0.06)discard;}
vec3 col=texture2D(uMap,vUv).rgb;col*=0.93+0.07*hash(floor(vUv*vec2(700.0,350.0)));
col=mix(col,uTip,uTipMix*uLayer*uLayer);float ao=mix(uAO,1.0,uLayer);
vec3 N=normalize(vN);vec3 V=normalize(cameraPosition-vW);float d=max(dot(N,normalize(uLight)),0.0);
float fill=max(dot(N,normalize(vec3(-0.6,0.25,0.6))),0.0);float rim=pow(1.0-max(dot(N,V),0.0),2.6);
vec3 lit=col*(0.40+0.66*d+0.2*fill)*ao+rim*0.2*mix(col,vec3(1.0),0.45);gl_FragColor=vec4(lit,1.0);}`;
const SETS={}; let curN=-1;
function makeSets(){
  Object.values(SETS).forEach(s=>{s.base.dispose();s.shells.forEach(m=>m.dispose())});
  const F=FUR[cfg.furType];curN=Math.max(0,Math.round(F.N*(isMobile?.6:1)));
  [['main','main'],['accent','accent'],['ear','ear'],['limb','limb'],['pad','pad'],['padName','padName']].forEach(([k,t])=>{
    const sh={uMap:{value:TX[t].t},uLen:{value:0},uDensity:{value:100},uCurl:{value:0},uGrav:{value:0},uTime:{value:0},uWind:{value:.15},uTip:{value:new THREE.Color()},uTipMix:{value:0},uAO:{value:1},uLight:{value:LIGHT_DIR}};
    const mk=(layer,base)=>new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,uniforms:Object.assign({},sh,{uLayer:{value:layer},uBase:{value:base}})});
    const shells=[];if(k!=='pad'&&k!=='padName')for(let i=1;i<=curN;i++)shells.push(mk(i/curN,0));
    SETS[k]={sh,base:mk(0,1),shells};
  });
  updateUniforms();
}
function updateUniforms(){
  const F=FUR[cfg.furType],ls=.6+cfg.furLen*1.0;
  for(const k in SETS){const u=SETS[k].sh,acc=k==='accent';
    u.uLen.value=F.len*ls*(acc?.5:1);u.uDensity.value=(55+cfg.furDensity*130)*(acc?1.3:1);u.uCurl.value=F.curl;u.uGrav.value=F.grav;
    u.uTip.value.set(acc?cfg.accent:cfg.tip);u.uTipMix.value=acc?0:cfg.tipMix;u.uAO.value=curN>0&&k!=='pad'&&k!=='padName'?.5:1;
    u.uMap.value=k==='ear'&&!cfg.earColor?TX.main.t:k==='limb'&&!cfg.limbColor?TX.main.t:TX[k].t;

function parseWish(text){

  const hit=s=>s.includes(' ')?t.includes(s):s[0]==='='?words.includes(s.slice(1)):words.some(w=>w.startsWith(s));
  KW.forEach(([st,fn,lab])=>{if(st.some(hit)){fn(c);got.push(lab)}});
  const SZ=[[['больш','огромн','гигант','длинн','высок'],.92],[['маленьк','крошеч','мини','коротк','крохотн'],.12]];
  const SN=[[['глаз','глазк'],'eyeSize','глаза'],[['уш','ух'],'earSize','уши'],[['голов'],'headSize','голова'],[['лап','рук'],'armLen','лапки'],[['ног','нож'],'legLen','ножки'],[['мишк','медвед'],'size','мишка']];
  words.forEach((w,i)=>{const sz=SZ.find(([st])=>st.some(s=>w.startsWith(s)));if(!sz)return;
    for(let j=i+1;j<=Math.min(words.length-1,i+3);j++){const n=SN.find(([ns])=>ns.some(x=>words[j].startsWith(x)));if(n){if(n[1]==='size')c.size=sz[1]>.5?'45':'20';else c[n[1]]=sz[1];got.push((sz[1]>.5?'большие ':'маленькие ')+n[2]);break}}});

    for(let j=i-1;j>=Math.max(0,i-2)&&!target;j--)for(const [ns,k] of NOUN)if(ns.some(n=>words[j].startsWith(n))){target=k;break}
    target=target||'main';c[target]=col[1];
    if(target==='iris'&&!['glossy','anime','star'].includes(c.eyes))c.eyes='glossy';
    if(target==='patternColor'&&c.pattern==='none')c.pattern='spots';
    if(target==='main'){const cc=new THREE.Color(col[1]);c.tip='#'+cc.clone().lerp(new THREE.Color('#ffffff'),.25).getHexString();if(lum(col[1])<.25&&c.accent===DEF.accent)c.accent='#'+cc.clone().lerp(new THREE.Color('#ffffff'),.2).getHexString()}

}

const dec=s=>{const b=s.trim().replace(/^BEAR-/i,'');return Object.assign(clone(DEF),JSON.parse(decodeURIComponent(escape(atob(b)))))};
document.getElementById('share').onclick=()=>{const code=enc(cfg);const msg=el('p',{class:'note'},'Отправь код другу: он вставит его сюда и получит точно такого же мишку.');
  const inp=el('input',{class:'txt',id:'dna-in',placeholder:'Вставь код BEAR-…'});const err=el('p',{class:'note',style:'color:var(--risk)'});
  openModal([el('div',{class:'body'},[el('h3',{},'Код мишки'),msg,el('div',{class:'code',id:'dna'},code),el('div',{class:'acts'},[el('button',{class:'btn v',onclick:e=>{const b=e.currentTarget;const done=()=>b.textContent='Скопировано';if(navigator.clipboard)navigator.clipboard.writeText(code).then(done,()=>selectCode());else selectCode()}},'Скопировать')]),
    el('div',{class:'lbl',style:'font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px'},'Открыть чужой код'),inp,err,el('div',{class:'acts'},[el('button',{class:'btn go',onclick:()=>{try{const c=dec(inp.value);closeModal();applyCfg(c,'Мишка по коду загружен!')}catch(x){err.textContent='Код не подошёл. Проверь, что скопирован целиком.'}}},'Загрузить'),el('button',{class:'btn g',onclick:closeModal},'Закрыть')])])],true)};
function selectCode(){const d=document.getElementById('dna');const r=document.createRange();r.selectNodeContents(d);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function spec(c){const L=(k)=>optL(k,c[k]);const rows=[['Размер',L('size')],['Ткань',L('furType')+(c.furType!=='smooth'?`, ворс ${Math.round((FUR[c.furType].len*(.6+c.furLen))*100)} мм`:'')],['Цвета',`основной ${c.main}, мордочка ${c.accent}${c.limbColor?', лапы '+c.limbColor:''}${c.earColor?', уши '+c.earColor:''}, подушечки ${c.pads}`],
  ['Узор',L('pattern')+(c.pattern!=='none'?' '+c.patternColor:'')],['Голова',`${L('headShape')}, уши: ${L('ears')}`],['Глаза',L('eyes')+(['glossy','anime','star'].includes(c.eyes)?' '+c.iris:'')+(c.glow?', светятся':'')],
  ['Мордочка',`рот: ${L('mouth')}, нос: ${L('noseType')}, эмоция ${c.emotion>.3?'весёлая':c.emotion<-.3?'грустная':'спокойная'}${c.brows?', бровки':''}${c.blush?', румянец':''}`],['Тело',`${L('body')}, ${L('pose').toLowerCase()}${c.belly?', пузико':''}${c.claws?', когти':''}`],
  ['Аксессуары',c.acc.length?c.acc.map(id=>ACC.find(a=>a.id===id).label).join(', '):'нет'],['Имя',c.name.trim()||'без вышивки']];return rows}
document.getElementById('done').onclick=()=>{
  const img=renderer.domElement.toDataURL('image/png');const items=priceItems(cfg);
  const tb=el('table',{class:'spec'});spec(cfg).forEach(([a,b])=>tb.append(el('tr',{},[el('td',{},a),el('td',{},b)])));
  const pt=el('table',{class:'spec'});items.forEach(([a,b])=>pt.append(el('tr',{},[el('td',{},a),el('td',{class:'n'},fmt(b)+' ₽')])));
  const bodyEl=el('div',{class:'body'});
  const step1=()=>{bodyEl.innerHTML='';bodyEl.append(el('h3',{},cfg.name.trim()?`Мишка ${cfg.name.trim()} готов!`:'Твой мишка готов!'),el('div',{class:'lbl',style:'font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em'},'Техкарта для мастерской'),tb,el('div',{class:'lbl',style:'font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em'},'Стоимость'),pt,
    el('div',{class:'total'},[el('b',{},'Итого'),el('span',{},fmt(total(cfg))+' ₽')]),
    el('div',{class:'acts'},[el('button',{class:'btn go',onclick:step2},'Оформить заказ'),el('button',{class:'btn v',onclick:stepParent},'Попросить у взрослого'),el('button',{class:'btn g',onclick:closeModal},'Ещё поменяю')]))};
  const stepParent=()=>{bodyEl.innerHTML='';bodyEl.append(el('h3',{},'Покажи этот экран взрослому'),el('p',{class:'note'},'Здесь всё, что ты придумал, и сколько это стоит. Взрослый может оформить заказ сам.'),el('div',{class:'total'},[el('b',{},'Итого'),el('span',{},fmt(total(cfg))+' ₽')]),
    el('div',{class:'demo'},'В рабочей версии родителю придёт ссылка на оплату по СМС или в мессенджер, а ребёнку не нужно вводить свои данные.'),el('div',{class:'acts'},[el('button',{class:'btn go',onclick:step2},'Я взрослый, оформить'),el('button',{class:'btn g',onclick:step1},'Назад')]))};
  const step2=()=>{bodyEl.innerHTML='';const f=el('form',{class:'form'});const fi=(id,ph,type='text')=>el('input',{class:'txt',id,placeholder:ph,type,required:''});
    f.append(fi('o-name','Имя взрослого'),fi('o-phone','Телефон','tel'),fi('o-city','Город и адрес доставки'),el('button',{class:'btn go',type:'submit'},`Заказать за ${fmt(total(cfg))} ₽`));
    f.addEventListener('submit',e=>{e.preventDefault();bodyEl.innerHTML='';bodyEl.append(el('h3',{},'Заявка собрана'),el('div',{class:'ok'},'Это демо-версия: заказ никуда не отправлен и оплата не списана.'),el('p',{class:'note'},'В рабочей версии здесь будет оплата, а мастерская получит техкарту и код мишки:'),el('div',{class:'code'},enc(cfg)),el('div',{class:'acts'},[el('button',{class:'btn g',onclick:closeModal},'Закрыть')]))});
    bodyEl.append(el('h3',{},'Оформление'),el('div',{class:'demo'},'Прототип: данные не сохраняются и никуда не отправляются.'),f,el('div',{class:'acts'},[el('button',{class:'btn g',onclick:step1},'Назад')]))};
  step1();openModal([el('div',{class:'shot'},el('img',{src:img,alt:'Твой мишка'})),bodyEl]);wave=1;bounce=1;confetti()};

/* ============ MODE ============ */
function setMode(m){mode=m;document.getElementById('m-kid').setAttribute('aria-pressed',String(m==='kid'));document.getElementById('m-pro').setAttribute('aria-pressed',String(m==='pro'));renderPanel()}
document.getElementById('m-kid').onclick=()=>setMode('kid');document.getElementById('m-pro').onclick=()=>setMode('pro');
document.getElementById('undo').onclick=()=>goHist(-1);document.getElementById('undo2').onclick=()=>goHist(-1);document.getElementById('redo').onclick=()=>goHist(1);

/* ============ START ============ */
paintAll();makeSets();renderRail();resize();build();focusCam(false);if(cfg.model!=='parts')loadTeddy();addEventListener('resize',resize);renderPanel();updPrice();updHist();
document.getElementById('loading').remove();
setTimeout(()=>say('Привет! Я твой мишка. Выбери готового или напиши «Хочу…»'),600);
loop();
try{if('serviceWorker' in navigator&&!/claudeusercontent|claude\.ai/.test(location.hostname)&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(x){}
})();
</script>
