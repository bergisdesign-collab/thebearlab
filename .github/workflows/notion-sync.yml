name: Notion sync

# Notion blocks Russian IPs, Yandex Cloud has Russian IPs — so the bridge runs here, on GitHub.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements-sync.txt
      - run: pip install -r requirements-sync.txt
      - name: Sync Notion <-> YDB
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YDB_ENDPOINT: ${{ secrets.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ secrets.YDB_DATABASE }}
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$YDB_ENDPOINT" ]; then
            echo "Secrets are not configured yet — skipping"; exit 0
          fi
          printf '%s' "$YC_SA_KEY_JSON" > "$RUNNER_TEMP/sa.json"
          export YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS="$RUNNER_TEMP/sa.json"
          python -m sync.run_sync
