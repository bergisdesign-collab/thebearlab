name: Bot tests & deploy

on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["bot/**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Import check of the aiogram/YDB layer
        run: python -c "import handler, run_polling, tbl_bot.storage.ydb_store"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_FUNCTION_NAME: ${{ secrets.YC_FUNCTION_NAME || 'thebearlab-bot' }}
      YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy new function version
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          YDB_ENDPOINT: ${{ secrets.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ secrets.YDB_DATABASE }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$YC_SA_KEY_JSON" ] || [ -z "$BOT_TOKEN" ]; then
            echo "Yandex Cloud secrets are not configured yet — skipping deploy"; exit 0
          fi
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          export PATH="$HOME/yc/bin:$PATH"
          printf '%s' "$YC_SA_KEY_JSON" > sa.json
          yc config set service-account-key sa.json
          yc config set folder-id "$YC_FOLDER_ID"
          (cd bot && zip -qr ../bot.zip tbl_bot handler.py requirements.txt -x '*/__pycache__/*')
          yc serverless function version create \
            --function-name "$YC_FUNCTION_NAME" \
            --runtime python312 --entrypoint handler.handler \
            --memory 256m --execution-timeout 30s \
            --service-account-id "$YC_SERVICE_ACCOUNT_ID" \
            --source-path bot.zip \
            --environment "BOT_TOKEN=$BOT_TOKEN,WEBHOOK_SECRET=$WEBHOOK_SECRET,YDB_ENDPOINT=$YDB_ENDPOINT,YDB_DATABASE=$YDB_DATABASE,YDB_METADATA_CREDENTIALS=1,ADMIN_IDS=$ADMIN_IDS,GITHUB_TOKEN=$GH_DISPATCH_TOKEN,GITHUB_REPO=${{ github.repository }}"
          rm -f sa.json
