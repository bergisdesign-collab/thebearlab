name: Bot tests & deploy

on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["bot/**"]
  workflow_dispatch: {}

env:
  REGION: europe-west1
  SERVICE: thebearlab-bot

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Start Firestore emulator
        run: |
          npm install -g firebase-tools@13 >/dev/null 2>&1
          firebase emulators:start --only firestore --project demo-tbl > /tmp/emu.log 2>&1 &
          for i in $(seq 1 60); do curl -s localhost:8080 >/dev/null && break; sleep 2; done
          curl -s localhost:8080 || (cat /tmp/emu.log; exit 1)
      - name: Tests (incl. Firestore emulator)
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
        run: python -m pytest -q -rs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$GCP_SA_KEY" ] || [ -z "$GCP_PROJECT" ]; then
            echo "Google Cloud secrets are not configured yet — skipping deploy"; echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.go == 'yes'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: steps.check.outputs.go == 'yes'
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        if: steps.check.outputs.go == 'yes'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          printf 'BOT_TOKEN: "%s"\nNOTION_TOKEN: "%s"\nWEBHOOK_SECRET: "%s"\nCRON_SECRET: "%s"\nADMIN_IDS: "%s"\nSTORAGE: "firestore"\n' \
            "$BOT_TOKEN" "$NOTION_TOKEN" "$WEBHOOK_SECRET" "$CRON_SECRET" "$ADMIN_IDS" > "$RUNNER_TEMP/env.yaml"
          gcloud run deploy "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" --source bot \
            --allow-unauthenticated --env-vars-file "$RUNNER_TEMP/env.yaml" \
            --memory 512Mi --cpu 1 --timeout 300 --concurrency 20 --min-instances 0 --max-instances 1 --quiet
          rm -f "$RUNNER_TEMP/env.yaml"
      - name: Webhook, bot menu and scheduler
        if: steps.check.outputs.go == 'yes'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" --format 'value(status.url)')
          curl -fsS -X POST -H "X-Cron-Secret: $CRON_SECRET" "$URL/cron/setup"; echo
          ARGS=(--project "$GCP_PROJECT" --location "$REGION" --schedule "*/10 * * * *" --time-zone "Europe/Moscow"
                --uri "$URL/cron/tick" --http-method POST --update-headers "X-Cron-Secret=$CRON_SECRET" --attempt-deadline 300s)
          if gcloud scheduler jobs describe tbl-tick --project "$GCP_PROJECT" --location "$REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http tbl-tick "${ARGS[@]}" --quiet
          else
            gcloud scheduler jobs create http tbl-tick "${ARGS[@]/--update-headers/--headers}" --quiet
          fi
